name: CI

on:
  workflow_dispatch:
    inputs:
      deploy-production:
        description: Deploy the staging-verified release to protected production
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Keep the public repository agent-instruction-free
        run: |
          if find . -type f \( -name AGENTS.md -o -name CLAUDE.md \) -print -quit | grep -q .; then
            echo "AGENTS.md and CLAUDE.md must not be committed to this repository" >&2
            exit 1
          fi

  phoenix:
    uses: ogourment/github-ci-cd-harness/.github/workflows/phoenix.yml@main
    with:
      run-acceptance: true
      build-release: true
      release-artifact-name: pauseai-ca-release
      release-id-prefix: pauseai-ca
      test-command: mix ci.test
    secrets:
      acceptance-harness-token: ${{ secrets.ACCEPTANCE_HARNESS_TOKEN }}

  delivery:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [repository-boundary, phoenix]
    uses: ogourment/github-ci-cd-harness/.github/workflows/phoenix-delivery.yml@main
    with:
      artifact-name: pauseai-ca-release
      otp-app: pauseai_ca
      remote-env-prefix: PAUSEAI_CA
      deploy-staging: true
      deploy-production: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy-production }}
      staging-environment-url: https://staging.pauseai.ca
      production-environment-url: https://new.pauseai.ca
    secrets:
      staging-host: ${{ secrets.STAGING_HOST }}
      staging-ssh-host: ${{ secrets.STAGING_SSH_HOST }}
      staging-ssh-user: ${{ secrets.STAGING_SSH_USER }}
      staging-ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      staging-ssh-known-hosts: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      staging-remote-deploy-script: ${{ secrets.STAGING_REMOTE_DEPLOY_SCRIPT }}
      production-host: ${{ secrets.PRODUCTION_HOST }}
      production-ssh-host: ${{ secrets.PRODUCTION_SSH_HOST }}
      production-ssh-user: ${{ secrets.PRODUCTION_SSH_USER }}
      production-ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      production-ssh-known-hosts: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      production-remote-deploy-script: ${{ secrets.PRODUCTION_REMOTE_DEPLOY_SCRIPT }}
