# Consumer-local adapter based on ogourment/github-ci-cd-harness v0.4.45.
# Retains its quality/release gates; fetches public compiled package distributions.
name: PauseAI Phoenix CI

on:
  workflow_call:
    inputs:
      elixir-version:
        description: Elixir version
        type: string
        default: "1.20.2"
      otp-version:
        description: Erlang/OTP version
        type: string
        default: "29.0.3"
      run-acceptance:
        description: Run the consumer's mix test.atdd alias and retain evidence
        type: boolean
        default: false
      build-release:
        description: Build and retain a production OTP release
        type: boolean
        default: false
      release-artifact-name:
        description: GitHub Actions artifact name for the OTP release
        type: string
        default: phoenix-release
      release-id-prefix:
        description: Prefix used for immutable deployment release identifiers
        type: string
        default: phoenix
      test-command:
        description: Consumer test/quality command
        type: string
        default: mix test

permissions:
  contents: read

jobs:
  test:
    # Release ERTS/NIFs must target the deployment host's Ubuntu 24.04 / GLIBC 2.39.
    # A rolling ubuntu-latest image can produce an archive the server cannot boot.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Fetch dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Compile without warnings
        run: mix compile --warnings-as-errors
      - name: Run tests
        run: ${{ inputs.test-command }}
      - name: Install pinned JavaScript tools
        if: ${{ inputs.run-acceptance || inputs.build-release }}
        run: |
          npm --prefix assets ci
          npm --prefix assets audit signatures
          expected="$(node -p "require('./assets/package.json').devDependencies.esbuild")"
          actual="$(assets/node_modules/.bin/esbuild --version)"
          test "$actual" = "$expected"
          printf 'MIX_ESBUILD_PATH=%s/assets/node_modules/.bin/esbuild\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          MIX_ESBUILD_PATH="$GITHUB_WORKSPACE/assets/node_modules/.bin/esbuild" mix run --no-start -e 'unless Esbuild.bin_version() == {:ok, Esbuild.configured_version()}, do: Mix.raise("Pinned esbuild version mismatch")'
      - name: Install Playwright Chromium
        if: ${{ inputs.run-acceptance }}
        run: npm --prefix assets exec -- playwright install --with-deps chromium chromium-headless-shell
      - name: Run browser acceptance tests
        if: ${{ inputs.run-acceptance }}
        env:
          ATDD: "true"
        run: mix test.atdd
      - name: Upload acceptance evidence
        if: ${{ always() && inputs.run-acceptance }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: tmp/atdd
          if-no-files-found: warn
          retention-days: 14
      - name: Build production assets
        env:
          MIX_ENV: prod
        run: mix assets.deploy
      - name: Build production release
        if: ${{ inputs.build-release }}
        env:
          MIX_ENV: prod
        run: mix release --overwrite
      - name: Record release identity
        if: ${{ inputs.build-release }}
        env:
          RELEASE_ID_PREFIX: ${{ inputs.release-id-prefix }}
        run: |
          version="$(mix run --no-start -e 'IO.write(Mix.Project.config()[:version])')"
          mkdir -p _build
          printf '%s\n' "$version" > _build/VERSION
          printf '%s-%s-%s\n' "$RELEASE_ID_PREFIX" "$version" "$GITHUB_RUN_ID" > _build/RELEASE_ID
      - name: Package verified acceptance evidence with the exact release
        if: ${{ inputs.build-release && inputs.run-acceptance }}
        run: |
          set -euo pipefail
          test -s tmp/atdd/evidence.json
          version="$(cat _build/VERSION)"
          app="$(mix run --no-start -e 'IO.write(Mix.Project.config()[:app])')"
          destination="_build/prod/rel/$app/lib/$app-$version/priv/acceptance_evidence"
          test -d "$(dirname "$destination")"
          mkdir -p "$destination"
          cp -a tmp/atdd/. "$destination/"
      - name: Archive production release with Unix permissions
        if: ${{ inputs.build-release }}
        run: tar -C _build/prod/rel -czf _build/release.tar.gz .
      - name: Upload production release
        if: ${{ inputs.build-release }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release-artifact-name }}
          path: |
            _build/RELEASE_ID
            _build/VERSION
            _build/release.tar.gz
          if-no-files-found: error
          retention-days: 14
